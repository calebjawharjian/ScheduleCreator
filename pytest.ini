[pytest]
testpaths = tests
# Project modules sit at the repo root, and conftest.py is imported directly by
# the test modules, so both need to be importable.
pythonpath = . tests
# Live tests hit NYU's servers and only pass while the term is published, so
# they stay out of the default run. Opt in with: pytest -m live
addopts = -m "not live"
markers =
    live: hits the real NYU endpoints; run deliberately, not on every change
